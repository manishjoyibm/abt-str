<!-- ko -->
<tr data-bind="visible: canVisibleCustomDiscountBlock && getRawValue() != 0" class="totals pdl_discount excl">
    <th class="mark" scope="row">
        <span class="label" data-bind="text: getPdlDiscountLabel"></span>
        <span class="value" data-bind="text: getValue()"></span>
    </th>
    <td class="amount">
            <span class="price" data-bind="text: getValue(), attr: {'data-th': getPdlDiscount}"></span>
    </td>
</tr>

<!-- /ko -->
